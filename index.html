<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>FocusFlow</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<!-- ===================== メイン画面 ===================== -->
<div id="screen-main" class="screen hidden">

  <!-- タスク管理 (FocusFlow) + そうじ (FlowClean) -->
  <section id="tab-tasks" class="tab-section ffx">
    <div class="ffx-embed" id="ffx-screen-main">
      <div class="main-header">
        <div class="app-title">FocusFlow</div>
        <div class="date-badge" id="dateBadge"></div>
        <div class="version-badge" id="versionBadge"></div>
        <button class="ffx-add-btn" id="ffx-add-btn" onclick="FFX.openNewTask()" aria-label="タスクを追加">＋追加</button>
        <button class="ffx-settings-btn" id="open-settings-btn" aria-label="せってい">⚙</button>
      </div>

      <div class="ffx-tabbar">
        <button class="ffx-tabbtn active" id="tab-btn-home" onclick="FFX.switchTab('home')">タスク</button>
        <button class="ffx-tabbtn" id="tab-btn-all" onclick="FFX.switchTab('all')">すべて</button>
        <button class="ffx-tabbtn" id="tab-btn-fc" onclick="FFX.switchTab('fc')">そうじ</button>
      </div>

      <!-- HOME TAB (タスクダッシュボード) -->
      <div class="tab-content visible" id="ffx-tab-home">
        <div class="time-bar-wrap">
          <div class="time-bar-label">
            <span class="time-bar-remaining">今日の残り <strong id="timeBarRemaining">0.0</strong>h</span>
            <span class="time-bar-total" id="timeBarTotal">/ 0.0h</span>
          </div>
          <div class="time-bar-track">
            <div class="time-bar-fill" id="timeBarFill" style="width:0%"></div>
          </div>
        </div>
        <div class="scroll">
          <div class="group-rows" id="mainGroups"></div>
        </div>
      </div>

      <!-- ALL TAB (タスク編集) -->
      <div class="tab-content" id="tab-all">
        <div id="timelineContainer" style="padding: 12px 20px 0; display:none;"></div>
        <div style="display:flex;justify-content:flex-end;padding:8px 20px 4px;">
          <button id="deleteModeBtn" onclick="FFX.toggleDeleteMode()"
            style="border:1.5px solid var(--border-strong);background:none;font-size:14px;font-weight:700;cursor:pointer;padding:4px 12px;border-radius:50px;color:var(--text3);font-family:'Noto Sans JP',sans-serif;transition:all .15s;">削除</button>
        </div>
        <div class="scroll" id="allTasksScroll"></div>
      </div>

      <!-- FLOWCLEAN TAB (そうじ: 家事フロー) -->
      <div class="tab-content" id="ffx-tab-fc">
        <div id="fc-app" class="fc"></div>
      </div>
    </div>
  </section>

  <!-- せってい -->
  <section id="tab-settings" class="tab-section hidden">
    <div class="page-header">
      <button class="back-btn" id="settings-back-btn" aria-label="戻る">‹</button>
      <h2 class="page-title">⚙️ せってい</h2>
    </div>
    <div class="settings-content">
      <div class="settings-section">
        <h3 class="settings-section-title">タスク</h3>
        <p class="import-desc">期限切れのタスクを1件ずつ確認して、今日やる/延期する/削除するを選び直せます。通常は毎日最初のアクセス時に自動で出ますが、ここからいつでも手動で開けます。</p>
        <button class="btn-secondary" id="settings-triage-btn">🗂 期限切れタスクを棚卸しする</button>
      </div>

      <div class="settings-section danger-zone">
        <h3 class="settings-section-title danger-title">⚠️ データリセット</h3>
        <p class="danger-desc">すべてのタスクとそうじの設定が消えます。この操作は取り消せません。</p>
        <button class="btn-danger" id="settings-reset">リセットする</button>
      </div>
    </div>
  </section>
</div>

<!-- ===================== 期限切れタスクの棚卸し (毎日最初のアクセス時) ===================== -->
<div id="triage-overlay" class="triage-overlay hidden">
  <div class="triage-box">
    <div class="triage-progress" id="triage-progress"></div>
    <div class="triage-card">
      <div class="triage-overdue-badge" id="triage-overdue-label"></div>
      <div class="triage-task-title" id="triage-task-title"></div>
    </div>
    <div class="triage-actions">
      <button class="triage-btn triage-btn-today" id="triage-today">今日</button>
      <div class="triage-chip-row">
        <button class="triage-chip" id="triage-defer-1">明日</button>
        <button class="triage-chip" id="triage-defer-7">来週</button>
        <label class="triage-chip triage-date-chip">
          <span>日付を選ぶ</span>
          <input type="date" id="triage-date-input" aria-label="日付を選ぶ">
        </label>
      </div>
      <div class="triage-link-row">
        <button class="triage-link" id="triage-delete">削除</button>
        <button class="triage-link" id="triage-skip">あとで</button>
      </div>
    </div>
  </div>
</div>

<!-- ===================== 確認ダイアログ ===================== -->
<div id="confirm-overlay" class="modal-overlay hidden">
  <div class="modal">
    <div class="modal-header">
      <h3 id="confirm-title">確認</h3>
    </div>
    <p id="confirm-message" class="confirm-message"></p>
    <div class="modal-actions">
      <button class="btn-secondary" id="confirm-cancel">キャンセル</button>
      <button class="btn-danger" id="confirm-ok">リセット</button>
    </div>
  </div>
</div>

<!-- ===================== FocusFlow サブ画面 (グループ/集中/編集) ===================== -->
<div class="ffx" id="ffx-overlays">
<div class="ffx-screen" id="ffx-screen-group">
  <div class="screen-header">
    <button class="back-btn" onclick="FFX.goBack('group')">‹</button>
    <div class="header-title" id="groupHeaderTitle"></div>
    <div class="header-sub" id="groupHeaderSub"></div>
    <button class="group-edit-btn hidden" id="groupReorderBtn" onclick="FFX.toggleReorderMode()">編集</button>
  </div>
  <div class="scroll">
    <div class="ffx-task-list" id="groupTaskList"></div>
  </div>
</div>

<!-- ════ SCREEN: FOCUS ════ -->
<div class="ffx-screen" id="ffx-screen-focus">
  <div class="screen-header">
    <button class="back-btn" onclick="FFX.goBack('focus')">‹</button>
    <div class="header-title">集中モード</div>
  </div>
  <div class="focus-body">
    <div class="focus-task-title" id="focusTaskTitle"></div>
    <div class="focus-step-widget" id="focusStepWidget" style="display:none"></div>
    <div class="timer-ring-wrap">
      <div class="timer-ring" id="timerRing"></div>
      <!-- ドットSVG：赤弧の先端(r=81、12時位置)に白ドットを置いて回転 -->
      <svg class="timer-arrow-svg" viewBox="0 0 180 180">
        <circle id="timerDot" cx="90" cy="9" r="6"
                fill="white" stroke="#c0392b" stroke-width="2"/>
      </svg>
      <div class="timer-inner" onclick="FFX.toggleTimer()">
        <div class="timer-display" id="timerDisplay">00:00</div>
        <div class="timer-hint" id="timerHint">タップで開始</div>
      </div>
    </div>
  </div>
</div>

<!-- ════ SCREEN: STEP DETAIL EDIT ════ -->
<div class="ffx-screen" id="ffx-screen-step-edit" style="z-index:185;">
  <div class="screen-header">
    <button class="back-btn" onclick="FFX.closeStepDetail()">‹</button>
    <div class="header-title">ステップを編集</div>
  </div>
  <div class="scroll" style="padding: 24px 20px 0;">
    <div class="edit-section-label">内容</div>
    <textarea class="step-detail-text" id="stepDetailText" placeholder="ステップの内容を入力"></textarea>
    <div class="step-detail-mins-wrap">
      <span class="step-detail-mins-label">推定</span>
      <input class="step-detail-mins" id="stepDetailMins" inputmode="numeric" placeholder="0">
      <span class="step-detail-mins-label">分</span>
    </div>
    <div class="edit-save-sticky">
      <button class="edit-save-btn" onclick="FFX.saveStepDetail()">保存</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<!-- ════ ACTION SHEET ════ -->
<div class="action-overlay" id="actionOverlay" onclick="FFX.closeActionSheet()">
  <div class="action-sheet" onclick="event.stopPropagation()">
    <div class="action-sheet-handle"></div>
    <div class="action-sheet-title" id="actionTitle"></div>
    <button class="action-btn" onclick="FFX.actionEdit()">✏️ 編集</button>
    <div class="action-section-label">優先度</div>
    <div class="action-urgency-row">
      <button class="action-urgency-btn" id="aub-must" onclick="FFX.actionSetUrgency('must')">今日中に絶対</button>
      <button class="action-urgency-btn" id="aub-want" onclick="FFX.actionSetUrgency('want')">できたら</button>
      <button class="action-urgency-btn" id="aub-nice" onclick="FFX.actionSetUrgency('nice')">余力があれば</button>
      <button class="action-urgency-btn" id="aub-scheduled" onclick="FFX.actionSetUrgency('scheduled')">後日実行予定</button>
    </div>
    <button class="action-btn danger" onclick="FFX.actionDelete()">🗑 削除</button>
    <button class="action-cancel" onclick="FFX.closeActionSheet()">キャンセル</button>
  </div>
</div>

<!-- ════ SCREEN: EDIT ════ -->
<div class="ffx-screen" id="ffx-screen-edit" style="z-index:175;">
  <div class="screen-header">
    <button class="back-btn" onclick="FFX.closeEditScreen()">‹</button>
    <div class="header-title">タスクを編集</div>
  </div>
  <div class="scroll" id="editScroll">
    <div class="edit-section">
      <div class="edit-section-label">タイトル</div>
      <input class="edit-title-input" id="editTaskTitle" placeholder="タスクのタイトル">
    </div>
    <div class="edit-section" style="margin-top:16px;">
      <div class="edit-section-label">期日（任意）</div>
      <input class="edit-due-input" id="editDueDate" type="date">
    </div>
    <div class="edit-section" style="margin-top:16px;">
      <div class="edit-section-label">実行日（後日実行予定の場合）</div>
      <input class="edit-due-input" id="editScheduledDate" type="date">
    </div>
    <div class="edit-section" style="margin-top:20px;">
      <div class="edit-section-label">ステップ</div>
      <button class="add-step-btn" onclick="FFX.addEditStep()" style="margin-bottom:8px;">＋ ステップを追加</button>
      <div class="step-edit-list" id="stepEditList"></div>
    </div>
    <div class="edit-save-sticky">
      <button class="edit-save-btn" onclick="FFX.saveEdit()">保存</button>
    </div>
  </div>
</div>
</div>

<script src="js/focusflow.js"></script>
<script src="js/flowclean.js"></script>
<script src="js/triage.js"></script>
<script src="js/core.js"></script>
<script src="js/main.js"></script>
</body>
</html>
